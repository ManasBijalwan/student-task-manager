name = "studyflow-api"
main = "src/worker.js"
compatibility_date = "2026-10-24"
compatibility_flags = ["nodejs_compat"]

[vars]
CLIENT_URL = "https://studyflow-ce2.pages.dev"
NODE_ENV = "production"

[[hyperdrive]]
binding = "HYPERDRIVE"
# Replace this with the ID returned when you create the Hyperdrive configuration.
id = "4996d3debdd04ad39d7ce9bd56b07ff7"

[triggers]
crons = ["0 0 * * *"]
