name: CI and CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:5001/api' }}

      - name: Save frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  deploy-pages:
    name: Deploy frontend to Cloudflare Pages
    needs: verify
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master') && vars.CLOUDFLARE_PAGES_PROJECT_NAME != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Check deployment settings
        env:
          API_URL: ${{ vars.VITE_API_URL }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$API_URL" ]; then echo "Set the VITE_API_URL repository variable to the deployed backend URL."; exit 1; fi
          if [ -z "$CF_ACCOUNT_ID" ]; then echo "Set the CLOUDFLARE_ACCOUNT_ID repository variable."; exit 1; fi
          if [ -z "$CF_API_TOKEN" ]; then echo "Set the CLOUDFLARE_API_TOKEN repository secret."; exit 1; fi

      - name: Deploy Pages site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4"
          command: pages deploy frontend/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-worker:
    name: Deploy backend to Cloudflare Workers
    needs: verify
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check deployment settings
        env:
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ]; then echo "Set the CLOUDFLARE_ACCOUNT_ID repository variable."; exit 1; fi
          if [ -z "$CF_API_TOKEN" ]; then echo "Set the CLOUDFLARE_WORKERS_API_TOKEN repository secret."; exit 1; fi
          if [ -z "$HYPERDRIVE_ID" ] || [ "$HYPERDRIVE_ID" = "REPLACE_WITH_HYPERDRIVE_ID" ]; then
            echo "Create a Hyperdrive configuration and replace the placeholder ID in backend/wrangler.toml."; exit 1
          fi
          CONFIG_ID=$(sed -n 's/^id = "\(.*\)"/\1/p' backend/wrangler.toml | head -n 1)
          if [ "$CONFIG_ID" != "$HYPERDRIVE_ID" ]; then
            echo "CLOUDFLARE_HYPERDRIVE_ID must match the ID in backend/wrangler.toml."; exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Worker dependencies
        run: npm ci

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4"
          workingDirectory: backend
          command: deploy

  publish-backend:
    name: Publish backend container
    needs: verify
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/task-manager-api" >> "$GITHUB_OUTPUT"

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Trigger backend deployment hook when configured
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$BACKEND_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --request POST "$BACKEND_DEPLOY_HOOK_URL"
          else
            echo "Backend image published. Set BACKEND_DEPLOY_HOOK_URL to trigger your hosting provider's deployment hook."
          fi
